- name: install nginx server
  hosts: frontend
  become: yes
  tasks:
  - name: install nginx
    package:
      name: nginx
      state: present

- name: start the service
  hosts:
  become: yes
  tasks:
  - name: start service
    service:
     name: starting 
     state: started